name: Build Workflow

on:
  push:
    branches: [ main ]
  workflow_call:
    # Explicitly define the inputs being passed from your orchestration file
    inputs:
      site-url:
        description: 'The URL of the site'
        required: true
        type: string
      branch-id:
        description: 'The ID of the branch'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        # Now clean and without the workspace-root flag
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm build
