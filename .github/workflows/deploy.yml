name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          # These placeholders allow the build to pass successfully
          JWT_SECRET: "build-time-placeholder"
          DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"

      # This creates the 'public' folder if it is missing
      - name: Ensure public directory exists
        run: mkdir -p public

      - name: Deploy to Ionos
        uses: ionos-deploy-now/artifact-action@v1
        with:
          # This points to the root of your project
          # The action will pick up the .next folder and public folder
          path: .
