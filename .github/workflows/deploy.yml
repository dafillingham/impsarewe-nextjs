name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install --global pnpm

      - name: Install and Approve Dependencies
        # This fixes the [ERR_PNPM_IGNORED_BUILDS] error
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --global
          pnpm rebuild canvas sharp

      - name: Build project
        run: pnpm run build

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".next,package.json,pnpm-lock.yaml"
          target: "/var/www/impsarewe/"

      - name: Finalize Server Setup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/impsarewe/
            mkdir -p .next/standalone/.next/static
            cp -r .next/static/* .next/standalone/.next/static/
            pm2 restart all || echo "PM2 process not found"
