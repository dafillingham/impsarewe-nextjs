name: Deploy Now
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm && pnpm install
      - run: pnpm build
      # The App integration handles deployment automatically 
      # without needing an API key in the YAML.
      - name: Deploy to IONOS
        uses: ionos-deploy-now/artifact-action@v1
        with:
          folder: out
