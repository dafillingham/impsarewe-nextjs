name: Deploy to IONOS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.x
      
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run tests
        run: pnpm test --run || true
      
      - name: Build project
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Create directory if it doesn't exist
            mkdir -p /var/www/impsarewe
            cd /var/www/impsarewe
            
            # Initialize git safely if it hasn't been set up yet
            if [ ! -d ".git" ]; then
              git init -b main
              git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dafillingham/impsarewe.git
            else
              # Always keep the token fresh in case it expired
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/dafillingham/impsarewe.git
            fi
            
            # Fetch and overwrite code cleanly
            git fetch origin main
            git reset --hard origin/main
            
            # Source standard user profiles to load Node paths if present
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # Run tools using npx to ensure the server finds them instantly
            npx pnpm install
            npx pnpm build
            npx pm2 restart impsarewe || npx pm2 start "npx pnpm start" --name "impsarewe"
            npx pm2 save

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi
