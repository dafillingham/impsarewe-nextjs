name: Deploy to IONOS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.x
      - run: pnpm install
      - run: pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/impsarewe
            cd /var/www/impsarewe
            
            git fetch origin main
            git reset --hard origin/main
            
            # Create the required configuration to authorize these builds
            echo "allowBuilds:" > pnpm-workspace.yaml
            echo "  canvas: true" >> pnpm-workspace.yaml
            echo "  sharp: true" >> pnpm-workspace.yaml
            echo "  esbuild: true" >> pnpm-workspace.yaml
            echo "  unrs-resolver: true" >> pnpm-workspace.yaml
            
            # Now run install - it will read the file and succeed
            npx pnpm install
            
            # Restart the application
            npx pm2 restart impsarewe || npx pm2 start "npx pnpm start" --name "impsarewe"
            npx pm2 save
