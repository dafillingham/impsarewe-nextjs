name: Deploy Now
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm && pnpm install
      - run: pnpm build
      # THIS STEP IS THE FIX: It tells IONOS the build is done and ready to go live
      - name: Deploy
        uses: ionos-deploy-now/artifact-action@v1
        with:
          service-host: api-eu.ionos.space
          project-id: a0e14c30-722a-440a-a431-9929ba78cf3b
          branch-id: main
          folder: out
