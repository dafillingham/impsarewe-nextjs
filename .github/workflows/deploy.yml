name: Deploy to IONOS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.x
      
      # 1. Create .npmrc to bypass pnpm build script security
      - name: Configure pnpm build security
        run: echo "dangerously-allow-all-builds=true" >> .npmrc
      
      - name: Install dependencies
        run: pnpm install
      
      # 2. Add secrets to the build environment
      - name: Build project
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/impsarewe
            cd /var/www/impsarewe
            
            git fetch origin main
            git reset --hard origin/main
            
            # Ensure pnpm allows builds on the server too
            echo "dangerously-allow-all-builds=true" > .npmrc
            
            # Install on server
            npx pnpm install
            
            # Restart App
            npx pm2 restart impsarewe || npx pm2 start "npx pnpm start" --name "impsarewe"
            npx pm2 save
