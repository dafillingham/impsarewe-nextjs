name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install --global pnpm

      - name: Install dependencies
        # The --unsafe-perm flag allows canvas/sharp to build correctly
        run: pnpm install --frozen-lockfile --unsafe-perm

      - name: Build project
        run: pnpm run build

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: ".next,package.json,pnpm-lock.yaml"
          target: "/var/www/impsarewe/"

      - name: Restart Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/impsarewe/
            # Ensure the standalone static folder exists
            mkdir -p .next/standalone/.next/static
            # Copy the static assets to where Nginx expects them
            cp -r .next/static/* .next/standalone/.next/static/
            # Restart your PM2 process (replace 'your-app-name' with your actual PM2 name)
            pm2 restart your-app-name || pm2 start npm --name "your-app-name" -- run start
