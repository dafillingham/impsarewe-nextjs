name: Deploy to IONOS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.x
      
      # 1. Authorize the build scripts by creating pnpm-workspace.yaml
      - name: Authorize build dependencies
        run: |
          echo "allowBuilds:" > pnpm-workspace.yaml
          echo "  canvas: true" >> pnpm-workspace.yaml
          echo "  sharp: true" >> pnpm-workspace.yaml
          echo "  esbuild: true" >> pnpm-workspace.yaml
          echo "  unrs-resolver: true" >> pnpm-workspace.yaml
      
      # 2. Run install (now that builds are allowed)
      - name: Install dependencies
        run: pnpm install
        
      - name: Build project
        run: pnpm build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            mkdir -p /var/www/impsarewe
            cd /var/www/impsarewe
            git fetch origin main
            git reset --hard origin/main
            
            # Authorize builds on the server side as well
            echo "allowBuilds:" > pnpm-workspace.yaml
            echo "  canvas: true" >> pnpm-workspace.yaml
            echo "  sharp: true" >> pnpm-workspace.yaml
            echo "  esbuild: true" >> pnpm-workspace.yaml
            echo "  unrs-resolver: true" >> pnpm-workspace.yaml
            
            npx pnpm install
            npx pm2 restart impsarewe || npx pm2 start "npx pnpm start" --name "impsarewe"
            npx pm2 save
